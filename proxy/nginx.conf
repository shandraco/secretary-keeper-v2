# The only container people reach. It bridges the user-facing network to the sealed backend network.
# Open WebUI is exposed in full; policy-api only exposes signed Excel downloads and its health check.
# The Open WebUI tool talks to policy-api directly on the backend network, never through here.

worker_processes 1;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 25m;
  proxy_read_timeout 600s;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Resolve upstream names per request, so the proxy starts even if a service is down.
  resolver 127.0.0.11 valid=30s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;

  # Open WebUI
  server {
    listen 3000;
    location / {
      set $owui http://open-webui:8080;
      proxy_pass $owui;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # policy-api: downloads only
  server {
    listen 8100;
    # Reports, workbooks, charts and documents: exactly the names policy-api signs (app/links.py FILE_NAME).
    location ~ "^/exports/[0-9a-f-]{36}(-(status|matrix|types))?\.(xlsx|pdf|docx|png)$" {
      limit_except GET { deny all; }
      set $api http://policy-api:8000;
      proxy_pass $api;
      proxy_set_header Host policy-api;
    }
    location = /health {
      set $api http://policy-api:8000;
      proxy_pass $api;
      proxy_set_header Host policy-api;
    }
    location / { return 404; }
  }

  # Review queue (Argilla UI). Answers 502 until `docker compose --profile review up -d` has started it.
  server {
    listen 6900;
    client_max_body_size 25m;
    location / {
      set $argilla http://argilla:6900;
      proxy_pass $argilla;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
