# GPU assignments, filled in by whoever installs this on a GPU server.
#
# Easiest: run `python3 scripts/setup_gpus.py`. It writes compose.gpu.yaml for you and checks it.
# By hand instead:
#   1. cp compose.gpu.example.yaml compose.gpu.yaml      (compose.gpu.yaml is not committed)
#   2. Replace every "SET-ME-…" below with GPU numbers from `nvidia-smi -L`. Delete optional services you don't run.
#   3. In .env set:
#        COMPOSE_FILE=compose.yaml:compose.gpu.yaml
#        ESCALATE_TP=<number of GPUs given to escalate>
#   4. `docker compose config --quiet` must print nothing.
#
# Rough sizing (check each model card for your exact hardware and precision):
#   Granite 4.2 30B is not listed: it runs on your own vLLM server, outside this stack.
#   embed     embedding      a few GB; embed and rerank can share one GPU
#   rerank    reranker       a few GB
#   extract   gpt-oss-20b    optional, about 24 GB; one GPU of its own
#   escalate  Inkling-Small  optional; GPU count per the vLLM Inkling recipe for your GPU family
# Rules: vLLM services (extract, escalate, judge-tuned, judge-candidate) never share a GPU with each other, and use
# 1, 2, 4 or 8 GPUs each.

services:
  embed:
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["SET-ME"], capabilities: [gpu]}]
  rerank:
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["SET-ME"], capabilities: [gpu]}]
  # Optional:
  extract:
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["SET-ME"], capabilities: [gpu]}]
  escalate:
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["SET-ME-1", "SET-ME-2", "SET-ME-3", "SET-ME-4"], capabilities: [gpu]}]
